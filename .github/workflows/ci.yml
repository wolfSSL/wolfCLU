name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    if: github.repository_owner == 'wolfssl'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # ASAN runs the full config sweep; the non-ASAN build only covers the
        # default --enable-wolfclu config (added via include below).
        config:
          - '--enable-wolfclu'
          - '--enable-wolfclu --enable-crl --enable-dsa --enable-pkcs7'
          - '--enable-wolfclu --enable-smallstack'
          - '--enable-wolfclu --enable-experimental --enable-dilithium'
          - '--enable-wolfclu --enable-smallstack --enable-experimental --enable-dilithium'
          - '--enable-all'

        sanitize: ['CC="cc -fsanitize=address" CFLAGS="-g"']
        # Single-valued on purpose: --disable-oid-table only affects wolfCLU's
        # own compilation, so sweeping it across every wolfSSL config would
        # rebuild wolfSSL 12 extra times to test the same code.  It gets one
        # dedicated job via include below.  Keeping the key here (rather than
        # omitting it) means that include entry overwrites an original matrix
        # value, so it adds a job instead of mutating an existing one.
        wolfCLUOpts: ['']

        include:
          - os: ubuntu-latest
            config: '--enable-wolfclu'
            sanitize: ''
          - os: macos-latest
            config: '--enable-wolfclu'
            sanitize: ''

          - os: ubuntu-latest
            config: '--enable-wolfclu'
            sanitize: 'CC="cc -fsanitize=address"'
            wolfCLUOpts: '--disable-oid-table'

          - os: macos-latest
            config: '--enable-wolfclu'
            sanitize: 'CC="cc -fsanitize=address"'
            wolfCLUOpts: '--disable-oid-table'

    name: ${{ matrix.os }} ${{ matrix.sanitize && 'ASAN' || '' }} (${{ matrix.config }})${{ matrix.wolfCLUOpts && format(' [{0}]', matrix.wolfCLUOpts) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: wolfclu

      - uses: actions/checkout@v4
        with:
          repository: wolfssl/wolfssl
          ref: master
          path: wolfssl

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install automake libtool

      - name: Build and install wolfSSL
        working-directory: ./wolfssl
        run: |
          ./autogen.sh
          # Lower the WC_SIG_MIN_HASH_TYPE floor (default SHA-256 on master
          # post-PR-10496) back to MD5 for test cases.
          ./configure ${{ matrix.config }} ${{ matrix.sanitize }} \
              CPPFLAGS="-DWC_SIG_MIN_HASH_TYPE=WC_HASH_TYPE_MD5" \
              --prefix=$GITHUB_WORKSPACE/build-dir
          make -j
          make install

      - name: Build wolfCLU
        working-directory: ./wolfclu
        run: |
          ./autogen.sh
          ./configure ${{ matrix.wolfCLUOpts }} ${{ matrix.sanitize }} \
              --with-wolfssl=$GITHUB_WORKSPACE/build-dir
          make -j

      - name: Run tests
        working-directory: ./wolfclu
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-dir/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build-dir/lib
        run: make check

      - name: Display log
        if: always()
        working-directory: ./wolfclu
        run: cat test-suite.log || true
